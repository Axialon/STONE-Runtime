name: Rover verification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rover-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'Axialon/STONE-Runtime' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      npm_config_ignore_scripts: 'true'
      npm_config_audit: 'false'
      npm_config_fund: 'false'
      npm_config_registry: 'https://registry.npmjs.org/'
    steps:
      - name: Checkout public snapshot only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node without dependency caching
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.16.0'
          package-manager-cache: false
      - name: Verify pinned dependency records before installation
        run: |
          node scripts/verify-lock.mjs
          node --test tests/rover-dependencies.test.mjs
      - name: Acquire the reviewed dependencies with lifecycle scripts disabled
        run: |
          npm --prefix experiments/rover3d ci --ignore-scripts --no-audit --no-fund
          npm --prefix apps/rover ci --ignore-scripts --no-audit --no-fund
      - name: Verify actual headless engine, policies, sessions and serving
        run: npm run verify:all
      - name: Record scope of result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          printf '## Rover verification\n\nJob status: %s\n\n' "$RESULT" >> "$GITHUB_STEP_SUMMARY"
          printf 'Source revision: `%s`\n\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf 'Headless experiment only. No browser, deployment, trained policy, or physical-machine certification.\n' >> "$GITHUB_STEP_SUMMARY"
